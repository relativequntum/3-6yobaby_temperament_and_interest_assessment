 {"id":"TMP-07","subscale":"冒险/高强度愉悦","report_subscale":"冒险/高强度愉悦","cluster":null,"construct":"外向性/活跃性 Surgency","text":"遇到有点难度或有点冒险的玩法，孩子愿意去尝试。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"面对陌生的新游乐设施或更难的关卡时他的态度。","anchors_by_band":{"4-5":"敢爬较高的攀爬架","5-6":"主动挑战更难的关卡"}},
 {"id":"TMP-08","subscale":"挫折/愤怒反应","report_subscale":"挫折/愤怒反应","cluster":"resilience","construct":"负性情绪 Negative Affectivity","text":"想做的事被打断或做不成时，孩子会生气、发脾气。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"回想最近他想做的事被打断时的反应强度。","anchors_by_band":{"3-4":"哭闹、跺脚","4-5":"抗议、喊叫","5-6":"生气但能说出来"}},
 {"id":"TMP-09","subscale":"挫折/愤怒反应","report_subscale":"挫折/愤怒反应","cluster":"resilience","construct":"负性情绪 Negative Affectivity","text":"玩具被别的小朋友拿走时，孩子会很激动地反应。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"被抢玩具时他反应的强度与持续时间。","anchors_by_band":null},
 {"id":"TMP-10","subscale":"可安抚性","report_subscale":"可安抚性","cluster":"resilience","construct":"负性情绪 Negative Affectivity","text":"孩子发脾气或哭闹后，能比较快地平静下来。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他闹完情绪后多久能恢复平静。","anchors_by_band":{"3-4":"需大人较久安抚","4-5":"说几句能平复","5-6":"能较快自己平复"}},
 {"id":"TMP-11","subscale":"恐惧/谨慎","report_subscale":"恐惧/谨慎","cluster":null,"construct":"负性情绪 Negative Affectivity","text":"遇到大的声响或陌生的动物，孩子会害怕。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"如吸尘器声、鞭炮声、陌生狗等情境下他的反应。","anchors_by_band":{"3-4":"怕吸尘器声、怕狗","4-5":"怕某些具体声音/动物","5-6":"怕特定情境，能说出怕什么"}},
 {"id":"TMP-12","subscale":"恐惧/谨慎","report_subscale":"恐惧/谨慎","cluster":null,"construct":"负性情绪 Negative Affectivity","text":"做没把握的事情前，孩子会显得担心、犹豫。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"面对没做过的事，他更多是跃跃欲试还是先观望。","anchors_by_band":{"3-4":"怕做错先求助","4-5":"做之前先问能不能","5-6":"担心失败而迟疑"}},
 {"id":"TMP-13","subscale":"注意聚焦/坚持","report_subscale":"注意聚焦/坚持","cluster":"focus_persistence","construct":"努力控制 Effortful Control","text":"做自己感兴趣的事时，孩子能专注比较长的时间。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他做最爱的活动时，给他计个时看能持续多久。","anchors_by_band":{"3-4":"专注约3-5分钟","4-5":"能完成一个有步骤的小任务","5-6":"能专注10分钟以上"}},
 {"id":"TMP-14","subscale":"注意聚焦/坚持","report_subscale":"注意聚焦/坚持","cluster":"focus_persistence","construct":"努力控制 Effortful Control","text":"做一件事时，孩子很容易被周围的事物吸引而分心。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"observe_hint":"他做手工时，旁边有动静是否就分神。","anchors_by_band":null},
 {"id":"TMP-15","subscale":"注意聚焦/坚持","report_subscale":"注意聚焦/坚持","cluster":"focus_persistence","construct":"努力控制 Effortful Control","text":"遇到有点难的任务，孩子会坚持尝试而不是马上放弃。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"给他略难一点的拼图，看他卡住后的反应。","anchors_by_band":{"3-4":"拼图卡住会再试几次","4-5":"卡住会换个方法试","5-6":"反复尝试搭复杂积木"}},
 {"id":"TMP-16","subscale":"抑制控制","report_subscale":"抑制控制","cluster":"inhibitory_control","construct":"努力控制 Effortful Control","text":"当大人说「先等一下」，孩子能忍住、等一会儿。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"让他「等大家都拿到再吃」，看他能等多久。","anchors_by_band":{"3-4":"能等几秒","4-5":"能等几十秒","5-6":"能等几分钟"}},
 {"id":"TMP-17","subscale":"抑制控制","report_subscale":"抑制控制","cluster":"inhibitory_control","construct":"努力控制 Effortful Control","text":"被告知不可以碰的东西，孩子还是会忍不住去碰。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"observe_hint":"被叮嘱不能碰的东西（如别人手机），他能不能管住自己。","anchors_by_band":{"3-4":"提醒下仍想碰","4-5":"提醒后能短暂忍住","5-6":"能较好管住自己"}},
 {"id":"TMP-18","subscale":"抑制控制","report_subscale":"抑制控制","cluster":"inhibitory_control","construct":"努力控制 Effortful Control","text":"很想要某样东西时，孩子能按约定先等一等再拿。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"约定「等一下再给」时，他能否遵守（类「棉花糖」情境）。","anchors_by_band":{"4-5":"约定后能短暂等待","5-6":"能为奖励延迟满足"}},
 {"id":"TMP-19","subscale":"冒险/高强度愉悦","report_subscale":"冒险/高强度愉悦","cluster":null,"construct":"外向性/活跃性 Surgency","text":"在游乐场或户外，孩子喜欢又跑又跳、玩得大声大动作，越热闹越开心。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"到户外活动时，看他是更想痛快地疯跑大动作，还是更想安静地待着。","anchors_by_band":{"3-4":"爱大声大动作地跑跳","4-5":"越热闹越带劲、玩得很疯","5-6":"主动找又跑又跳的激烈玩法"}}
]},
{"id":"SEL","title":"社会情绪与自我调节","intro":"这一部分了解孩子在情绪管理、自控、独立、与人相处和关心他人方面的表现。这些都是孩子的内在「优势」，会随着成长慢慢发展。请根据孩子最近一两周的真实表现，选择各行为出现的频率。","items":[
 {"id":"SEL-01","subscale":"情绪调节","report_subscale":"情绪调节","cluster":"resilience","construct":"自我调节·情绪面 Self-Regulation","text":"遇到不顺心的事（如玩具被拿走、要求被拒绝），孩子能在较短时间内平静下来。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他被拒绝后多久能恢复情绪。","anchors_by_band":{"3-4":"在大人安抚/转移下平复","4-5":"提醒后能等一会儿","5-6":"多能自己较快平复"}},
 {"id":"SEL-02","subscale":"情绪调节","report_subscale":"情绪调节","cluster":"resilience","construct":"自我调节·情绪面 Self-Regulation","text":"孩子能用说话的方式表达情绪（如「我有点害怕」「我生气了」），而不是只用哭闹。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他闹情绪时，是用语言说出来还是只用哭闹。","anchors_by_band":{"3-4":"以单词/短句为主","4-5":"能说出情绪词","5-6":"能说出原因"}},
 {"id":"SEL-03","subscale":"情绪调节","report_subscale":"情绪调节","cluster":"resilience","construct":"自我调节·情绪面 Self-Regulation","text":"一旦情绪上来（哭闹、发脾气），就很难安抚、要闹很久。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"observe_hint":"他闹起来时是否很难拉回来。","anchors_by_band":null},
 {"id":"SEL-04","subscale":"行为与冲动控制","report_subscale":"行为与冲动控制","cluster":"inhibitory_control","construct":"自我调节·行为面 Behavioral Control","text":"当大人说「停」或「不可以」时，孩子能停下正在做的事。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"你说「停」时他需要被说几次才停。","anchors_by_band":{"3-4":"常需重复才停","4-5":"提醒一次能停","5-6":"多数一次就停"}},
 {"id":"SEL-05","subscale":"行为与冲动控制","report_subscale":"行为与冲动控制","cluster":"inhibitory_control","construct":"自我调节·行为面 Behavioral Control","text":"在需要安静的场合（如坐车、吃饭、听故事），孩子能管住自己不乱跑乱动。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"一起在餐桌吃饭时，看他能安坐多久。","anchors_by_band":{"3-4":"能安静很短时间","4-5":"能安静一会儿","5-6":"能安静较长时间"}},
 {"id":"SEL-06","subscale":"行为与冲动控制","report_subscale":"行为与冲动控制","cluster":"inhibitory_control","construct":"自我调节·行为面 Behavioral Control","text":"孩子很冲动，想做什么就立刻去做，很难等或忍住。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"observe_hint":"他是不是想到什么就马上行动、很难按住。","anchors_by_band":null},
 {"id":"SEL-07","subscale":"主动性与自主","report_subscale":"主动性与自主","cluster":"initiative","construct":"主动性 Initiative","text":"孩子愿意自己尝试做事（如穿脱衣鞋、收拾玩具、拿取东西），而不是事事等人帮。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"出门前让他自己试着穿外套。","anchors_by_band":{"3-4":"想自己来但常需帮","4-5":"多数自理能独立完成","5-6":"多步自理能独立完成"}},
 {"id":"SEL-08","subscale":"主动性与自主","report_subscale":"主动性与自主","cluster":"initiative","construct":"主动性 Initiative","text":"玩或活动时，孩子会主动想点子、提议「我们来玩……」。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"consistency_pair_id":"cp-1","observe_hint":"给一段自由玩耍时间，看他是否能自己发起活动。","anchors_by_band":null},
 {"id":"SEL-09","subscale":"主动性与自主","report_subscale":"主动性与自主","cluster":"initiative","construct":"主动性 Initiative","text":"孩子做事很被动，几乎都要大人安排和催促才动。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"consistency_pair_id":"cp-1","observe_hint":"他是不是大多要被催着、带着才肯做。","anchors_by_band":null},
 {"id":"SEL-10","subscale":"依恋与关系","report_subscale":"依恋与关系","cluster":null,"construct":"依恋/关系 Attachment","text":"难过或害怕时，孩子会找熟悉的大人寻求安慰，并能被安抚下来。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他难过时会不会主动找你，找了之后能否被安抚。","anchors_by_band":null},
 {"id":"SEL-11","subscale":"依恋与关系","report_subscale":"依恋与关系","cluster":null,"construct":"依恋/关系 Attachment","text":"孩子能和其他小朋友一起玩、玩到一块儿去。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"和小朋友在一起时，是各玩各的还是真能玩到一起。","note":"计分归属唯一为「依恋与关系」。本题虽与 SDQ 亲社会有跨载，但已去除 SDQ 亲社会出处；如需共情线索，与共情/亲社会子维度合并叙述，不重复计入。","anchors_by_band":{"3-4":"多为各玩各的（平行游戏）","4-5":"开始一起玩","5-6":"有合作与共同主题"}},
 {"id":"SEL-12","subscale":"依恋与关系","report_subscale":"依恋与关系","cluster":null,"construct":"依恋/关系 Attachment","text":"和小朋友闹了别扭后，孩子能（在帮助下或自己）和好、继续一起玩。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他和小伙伴起冲突后是否能恢复一起玩。","anchors_by_band":{"4-5":"需大人协调才能和好","5-6":"能自己提出和好"}},
 {"id":"SEL-13","subscale":"共情与亲社会","report_subscale":"共情与亲社会","cluster":null,"construct":"共情与亲社会 Empathy & Prosocial","text":"看到别人难过或受伤，孩子会表现出关心（以下任一即可：注视、靠近、表情担心、问「你怎么了」）。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"家人假装碰疼了「哎哟」，看他的反应。","anchors_by_band":{"3-4":"注视/靠近即算","4-5":"会表现担心","5-6":"会问原因"}},
 {"id":"SEL-14","subscale":"共情与亲社会","report_subscale":"共情与亲社会","cluster":null,"construct":"共情与亲社会 Empathy & Prosocial","text":"孩子愿意把自己的玩具或零食分给别人。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"分点心时，看他是否愿意分给别人。","anchors_by_band":{"3-4":"多在被请求时","4-5":"较主动分享","5-6":"有自发分享"}},
 {"id":"SEL-15","subscale":"共情与亲社会","report_subscale":"共情与亲社会","cluster":null,"construct":"共情与亲社会 Empathy & Prosocial","text":"别人需要帮忙时（如够不到、拿不动），孩子会主动搭把手。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"你「假装」拿不动东西，看他是否来帮。","anchors_by_band":null},
 {"id":"SEL-16","subscale":"共情与亲社会","report_subscale":"共情与亲社会","cluster":null,"construct":"共情与亲社会 Empathy & Prosocial","text":"孩子能注意到别人的情绪，并据此调整自己的做法（如别人累了就不再缠着玩）。","age_bands":["5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他能否看出别人的情绪并相应调整自己。","anchors_by_band":null}
]},
{"id":"DEV","title":"发展快照","intro":"这一部分了解孩子在语言、运动、动手、动脑、自理等几条发展线上当前的表现。这不是发育筛查，也不判断「达标/落后」，只是帮您看清孩子目前各方面相对的样子。如果您对某方面有持续担心，请咨询儿童保健医生。请按孩子最近一两周的表现频率作答；每道题会根据孩子的年龄给出对应的观察例子。","items":[
 {"id":"DEV-01","subscale":"沟通/语言","report_subscale":"沟通/语言","cluster":null,"construct":"沟通 Communication","text":"孩子能和你一来一回地对话（你说一句、他接一句，连续好几个回合）。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"吃饭时随便聊一个话题，数数你们来回了几句。","anchors_by_band":{"3-4":"至少2个来回","4-5":"3个来回，并能说当天的事","5-6":"3个以上来回且能展开话题"}},
 {"id":"DEV-02","subscale":"沟通/语言","report_subscale":"沟通/语言","cluster":null,"construct":"沟通 Communication","text":"别人（不太熟的人）能听懂孩子在说什么。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"让不常见的亲戚听他讲一件事，看能否听懂。","anchors_by_band":{"3-4":"大多数时候能懂","4-5":"大部分能懂","5-6":"基本都能懂"}},
 {"id":"DEV-03","subscale":"沟通/语言","report_subscale":"沟通/语言","cluster":null,"construct":"沟通 Communication","text":"孩子能讲出一件当天或最近发生的事，说清楚来龙去脉。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"放学后问「今天发生了什么有趣的事」。","anchors_by_band":{"4-5":"能讲一件事","5-6":"故事含2个以上情节"}},
 {"id":"DEV-04","subscale":"大运动","report_subscale":"大运动","cluster":null,"construct":"大运动 Gross Motor","text":"孩子在户外跑动时既快又稳，很少摔跤。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"在小区空地看他跑一圈。","anchors_by_band":{"3-4":"跑得稳","4-5":"能急停转向","5-6":"跑动灵活协调"}},
 {"id":"DEV-05","subscale":"大运动","report_subscale":"大运动","cluster":null,"construct":"大运动 Gross Motor","text":"孩子玩攀爬、平衡木或蹦跳类游戏时身体协调、有把握。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"公园里看他玩攀爬架。","anchors_by_band":{"3-4":"能扶着爬、单脚短暂站立","4-5":"能走过平衡木/单脚站几秒","5-6":"能单脚连续跳几下"}},
 {"id":"DEV-06","subscale":"精细动作","report_subscale":"精细动作","cluster":null,"construct":"精细动作 Fine Motor","text":"孩子能用笔画画或涂色，手比较稳。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"给他纸笔，看他怎么握笔、画得稳不稳。","anchors_by_band":{"3-4":"能画封闭的圆圈/线条","4-5":"三指握笔、能画出有几个部位的人","5-6":"握笔正确、能写简单笔画或数字"}},
 {"id":"DEV-07","subscale":"精细动作","report_subscale":"精细动作","cluster":null,"construct":"精细动作 Fine Motor","text":"孩子能自己解开/扣上一些纽扣或拉拉链。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"换衣服时让他自己试一颗扣子。","anchors_by_band":{"3-4":"能解开纽扣","4-5":"能解开纽扣、能拉合拉链","5-6":"能自己扣上纽扣、独立拉合拉链"}},
 {"id":"DEV-08","subscale":"精细动作","report_subscale":"精细动作","cluster":null,"construct":"精细动作 Fine Motor","text":"孩子能把小东西串起来（串珠、通心粉、扣环等）。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"给他一根绳和几颗珠子。","anchors_by_band":{"3-4":"能串大珠","4-5":"能串较小的","5-6":"能串更小、更快"}},
 {"id":"DEV-09","subscale":"问题解决/认知","report_subscale":"问题解决/认知","cluster":null,"construct":"问题解决 Problem Solving","text":"遇到小困难（够不到、装不进），孩子会自己想办法尝试解决。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"玩具卡住时先别帮，看他怎么做。","anchors_by_band":{"3-4":"会试一两种办法","4-5":"更主动尝试","5-6":"会尝试多种策略"}},
 {"id":"DEV-10","subscale":"问题解决/认知","report_subscale":"问题解决/认知","cluster":null,"construct":"问题解决 Problem Solving","text":"讲熟悉的故事时，孩子能说出「接下来会发生什么」。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"读到一半停下让他猜后面。","anchors_by_band":{"4-5":"能预测情节","5-6":"预测更完整"}},
 {"id":"DEV-11","subscale":"问题解决/认知","report_subscale":"问题解决/认知","cluster":null,"construct":"问题解决 Problem Solving","text":"孩子能数数、认一些颜色或用「昨天/明天」这类词，用得基本对。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"上下楼梯一起数台阶，或聊「明天去哪」。","anchors_by_band":{"4-5":"能说出几种颜色、数几个数","5-6":"能数到10、会用时间词"}},
 {"id":"DEV-12","subscale":"个人-社会/自理","report_subscale":"个人-社会/自理","cluster":null,"construct":"个人-社会 Personal-Social","text":"孩子能自己穿/脱一些衣物（宽松裤子、外套等）。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"出门前让他自己穿外套。","anchors_by_band":{"3-4":"能穿部分","4-5":"能自己穿外套","5-6":"穿脱更独立"}},
 {"id":"DEV-13","subscale":"个人-社会/自理","report_subscale":"个人-社会/自理","cluster":null,"construct":"个人-社会 Personal-Social","text":"孩子能自己用勺子/筷子吃饭，洒得不多。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"一顿饭里观察他自己吃的程度。","anchors_by_band":{"3-4":"能自己用勺子吃、少量洒漏可接受","4-5":"会用筷子吃多数食物","5-6":"用筷子较熟练、少洒漏"}},
 {"id":"DEV-14","subscale":"个人-社会/自理","report_subscale":"个人-社会/自理","cluster":null,"construct":"个人-社会 Personal-Social","text":"玩有规则的游戏时，孩子能遵守规则、轮流等待。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"玩简单桌游看他能否轮流、守规则。","anchors_by_band":{"4-5":"过渡中，需提醒","5-6":"较稳定地守规则轮流"}},
 {"id":"DEV-15","subscale":"问题解决/认知","report_subscale":"问题解决/认知","cluster":null,"construct":"问题解决 Problem Solving","text":"玩拼插、套叠或形状配对类玩具时，孩子能自己琢磨出怎么把零件正确装到一起。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"给他一套形状配对或简单拼插玩具，先别示范，看他自己怎么试。","anchors_by_band":{"3-4":"能装对简单的形状/大块","4-5":"能试错调整、装对多数","5-6":"能有条理地一次次装对、较少求助"}}
]},
{"id":"INT","title":"兴趣画像","intro":"这一部分了解孩子相对更喜欢、更主动投入哪些活动。这里没有「对错」，每个孩子的兴趣组合都不一样，而且兴趣会随着成长和机会变化。请根据孩子最近一两周的真实表现，选择他对每类活动的喜爱/主动程度。最后几道题用来判断这些喜欢是否已经「上心」（持续、自发、沉浸）。","items":[
 {"id":"INT-01","subscale":"运动/大肌肉","report_subscale":"运动/大肌肉","cluster":null,"construct":"活动领域偏好·运动 INT-MOV","text":"遇到能跑、跳、爬的活动（追逐、攀爬架、球类），孩子的喜欢程度是？","age_bands":["3-4","4-5","5-6"],"scale":"like5","options":l5(),"reverse":false,"observe_hint":"到了公园/广场，他第一反应是冲过去跑动还是更想看/坐。","anchors_by_band":null},
 {"id":"INT-02","subscale":"艺术/绘画手工","report_subscale":"艺术/绘画手工","cluster":null,"construct":"活动领域偏好·艺术 INT-ART","text":"给孩子纸笔、颜料、黏土等让他涂画或做手工时，他的喜欢程度是？","age_bands":["3-4","4-5","5-6"],"scale":"like5","options":l5(),"reverse":false,"observe_hint":"他画完后会不会主动拿来给你看、讲他画了什么。","anchors_by_band":null},
 {"id":"INT-03","subscale":"音乐/律动","report_subscale":"音乐/律动","cluster":null,"construct":"活动领域偏好·音乐 INT-MUS","text":"听音乐/儿歌、跟着节奏拍手跳舞、玩能发声的乐器时，孩子的喜欢程度是？","age_bands":["3-4","4-5","5-6"],"scale":"like5","options":l5(),"reverse":false,"observe_hint":"有没有一首他百听不厌、会自己哼的歌。","anchors_by_band":null},
 {"id":"INT-04","subscale":"语言/故事","report_subscale":"语言/故事","cluster":null,"construct":"活动领域偏好·语言 INT-LAN","text":"听故事、读绘本、自己翻看图画书时，孩子的喜欢程度是？","age_bands":["3-4","4-5","5-6"],"scale":"like5","options":l5(),"reverse":false,"observe_hint":"他会不会主动要求「再讲一个/再读一遍」。","anchors_by_band":null},
 {"id":"INT-05","subscale":"数理/逻辑","report_subscale":"数理/逻辑","cluster":null,"construct":"活动领域偏好·数理 INT-LOG","text":"玩拼图、配对、找规律、数数、分类整理这类动脑游戏时，孩子的喜欢程度是？","age_bands":["3-4","4-5","5-6"],"scale":"like5","options":l5(),"reverse":false,"observe_hint":"他会不会自发地把玩具按某种规律摆好。","anchors_by_band":null},
 {"id":"INT-06","subscale":"自然探索","report_subscale":"自然探索","cluster":null,"construct":"活动领域偏好·自然 INT-NAT","text":"接触小动物、植物、虫子，或玩水、玩沙、户外观察时，孩子的喜欢程度是？","age_bands":["3-4","4-5","5-6"],"scale":"like5","options":l5(),"reverse":false,"observe_hint":"最近两周，他有没有缠着你问某样东西「为什么」。","anchors_by_band":null},
 {"id":"INT-07","subscale":"建构/搭建","report_subscale":"建构/搭建","cluster":null,"construct":"活动领域偏好·建构 INT-CON","text":"玩积木、磁力片、拼插玩具，把东西搭高、组装出成品时，孩子的喜欢程度是？","age_bands":["3-4","4-5","5-6"],"scale":"like5","options":l5(),"reverse":false,"observe_hint":"他会不会主动找积木类玩具来搭，并想搭得更高更复杂。","anchors_by_band":null},
 {"id":"INT-08","subscale":"社交/扮演","report_subscale":"社交/扮演","cluster":null,"construct":"活动领域偏好·社交扮演 INT-SOC","text":"玩过家家、角色扮演（当医生、开商店、修东西、做饭、照顾娃娃），或和小朋友合作游戏时，孩子的喜欢程度是？","age_bands":["3-4","4-5","5-6"],"scale":"like5","options":l5(),"reverse":false,"observe_hint":"他玩玩偶时会不会替它们说话、编情节。","anchors_by_band":null},
 {"id":"INT-09","subscale":"强度/沉浸","report_subscale":"强度/沉浸","cluster":"focus_persistence","construct":"兴趣品质·沉浸 INT-INT","text":"做他最爱的活动时，孩子会专注到听不见你叫他、像是忘了时间。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他有没有过本来说玩一会儿、结果远超时间还不肯停。","anchors_by_band":{"3-4":"玩到没注意你进来","4-5":"叫几声才回应","5-6":"完全沉浸、要等他停下才理你"}},
 {"id":"INT-10","subscale":"持续性/专注","report_subscale":"持续性/专注","cluster":"focus_persistence","construct":"兴趣品质·持续 INT-PER","text":"做喜欢的活动时，孩子能坚持较长时间而不频繁换来换去。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"consistency_pair_id":"cp-2","observe_hint":"他做最爱的活动能持续多久。","anchors_by_band":{"3-4":"约5-10分钟","4-5":"10-20分钟","5-6":"20分钟以上"}},
 {"id":"INT-11","subscale":"持续性/专注","report_subscale":"持续性/专注","cluster":"focus_persistence","construct":"兴趣品质·持续 INT-PER","text":"孩子很容易就对手头的活动失去兴趣、转去做别的。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"consistency_pair_id":"cp-2","observe_hint":"他是不是玩一下就丢、很快换别的。","anchors_by_band":null},
 {"id":"INT-12","subscale":"自主发起","report_subscale":"自主发起","cluster":"initiative","construct":"兴趣品质·自主 INT-SELF","text":"不用大人提议，孩子会自己找出或提出想玩的活动，并有明显偏爱。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"consistency_pair_id":"cp-3","observe_hint":"把几样玩具放一起，他通常先抓哪一两样。","anchors_by_band":{"3-4":"会主动奔向喜欢的","4-5":"会主动提出要玩什么","5-6":"会自己规划怎么玩"}},
 {"id":"INT-13","subscale":"自主发起","report_subscale":"自主发起","cluster":"initiative","construct":"兴趣品质·自主 INT-SELF","text":"孩子大多要等大人安排，自己很少主动选择想做的事。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"consistency_pair_id":"cp-3","observe_hint":"他是不是很少自己开始玩、总等人安排。","anchors_by_band":null},
 {"id":"INT-14","subscale":"掌握取向/愉悦","report_subscale":"掌握取向/愉悦","cluster":"mastery","construct":"兴趣品质·掌握 INT-MAS","text":"自己做到/完成一件事时，孩子会表现出明显的高兴、得意（笑、拍手、要你看）。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他做成一件事后的反应。","anchors_by_band":null},
 {"id":"INT-15","subscale":"掌握取向/愉悦","report_subscale":"掌握取向/愉悦","cluster":"mastery","construct":"兴趣品质·掌握 INT-MAS","text":"孩子喜欢挑战稍微有点难的玩法，而不只玩已经很熟的。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"给他略难一点的版本，看他是否更带劲。","anchors_by_band":{"4-5":"失败后愿再试","5-6":"主动找更难的挑战"}}
]},
{"id":"LRN","title":"学习品质","intro":"这一部分了解孩子「怎么学」的风格——好奇心、专注坚持、主动探索、灵活变通、面对挫折的恢复等。这些是比「学了多少」更重要的学习底色，而且都可以通过陪伴和鼓励慢慢培养。请根据孩子最近一两周的真实表现作答。","items":[
 {"id":"LRN-01","subscale":"专注与坚持","report_subscale":"专注与坚持","cluster":"focus_persistence","construct":"专注与坚持 Focus & Persistence","text":"玩他喜欢的活动时，孩子能专心投入、不容易被旁边的事吸引走。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"consistency_pair_id":"cp-4","observe_hint":"他做喜欢的事时旁边有动静会不会就分神。","anchors_by_band":{"3-4":"约5-10分钟即算专注","4-5":"10-15分钟","5-6":"15-20分钟以上"}},
 {"id":"LRN-02","subscale":"专注与坚持","report_subscale":"专注与坚持","cluster":"focus_persistence","construct":"专注与坚持 Focus & Persistence","text":"一件事没做完，孩子就想去做别的、很难收回注意力。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"consistency_pair_id":"cp-4","observe_hint":"他是不是常常一件事没完就跳去别的。","anchors_by_band":null},
 {"id":"LRN-03","subscale":"专注与坚持","report_subscale":"专注与坚持","cluster":"focus_persistence","construct":"专注与坚持 Focus & Persistence","text":"做一件需要好几步的事（如搭一座桥、画一幅画），孩子能坚持做到完成。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他做多步骤的事能否坚持到底。","anchors_by_band":{"4-5":"能做完多数步骤","5-6":"即使中间枯燥也能做完"}},
 {"id":"LRN-04","subscale":"好奇与探索","report_subscale":"好奇与探索","cluster":null,"construct":"好奇与探索 Curiosity","text":"看到没见过的东西，孩子会主动靠近、去看去摸、想弄清楚那是什么。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"桌上放一件新奇小物，看他是否主动探究。","anchors_by_band":null},
 {"id":"LRN-05","subscale":"好奇与探索","report_subscale":"好奇与探索","cluster":null,"construct":"好奇与探索 Curiosity","text":"孩子经常问「这是什么」「为什么会这样」之类的问题。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"读绘本时留意他主动发问的次数。","anchors_by_band":{"3-4":"多问「这是什么」","4-5":"出现「为什么/怎么会」","5-6":"围绕一个主题深挖追问"}},
 {"id":"LRN-06","subscale":"主动性与自我驱动","report_subscale":"主动性与自我驱动","cluster":"initiative","construct":"主动性与自我驱动 Initiative","text":"孩子会自己想出要玩什么、要做什么，而不是总等大人安排。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"给他空闲时间，他能否自己安排活动。","anchors_by_band":{"3-4":"简单自选","4-5":"会提议玩什么","5-6":"会提议并组织"}},
 {"id":"LRN-14","subscale":"主动性与自我驱动","report_subscale":"主动性与自我驱动","cluster":"initiative","construct":"主动性与自我驱动 Initiative","text":"孩子能为了一个自己定的小目标（如把这座塔搭高），主动想办法去实现。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他能否朝一个自己设的小目标坚持想办法。","anchors_by_band":{"4-5":"有简单目标导向","5-6":"目标导向＋计划萌芽"}},
 {"id":"LRN-07","subscale":"创造与灵活","report_subscale":"创造与灵活","cluster":null,"construct":"创造与灵活 Creativity & Flexibility","text":"同一种玩具或材料，孩子能想出好几种不同的玩法。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"只给纸和笔/几块积木，看玩法数量。","anchors_by_band":null},
 {"id":"LRN-08","subscale":"创造与灵活","report_subscale":"创造与灵活","cluster":null,"construct":"创造与灵活 Creativity & Flexibility","text":"玩法或规则变了，孩子能比较快地跟着调整，而不是非按原来不可。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"玩到一半改个小规则，看他能否切换。","anchors_by_band":null},
 {"id":"LRN-09","subscale":"创造与灵活","report_subscale":"创造与灵活","cluster":null,"construct":"创造与灵活 Creativity & Flexibility","text":"事情没按孩子原来想的来，他就很难接受、一定要照老样子。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"observe_hint":"计划临时有变时，他是否很难接受。","anchors_by_band":null},
 {"id":"LRN-10","subscale":"掌握愉悦与挑战取向","report_subscale":"掌握愉悦与挑战取向","cluster":"mastery","construct":"掌握愉悦与挑战取向 Mastery & Challenge","text":"自己做成一件有点难的事时，孩子会很开心、兴奋，还想再做一次或挑战更难的。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他做成有点难的事后是更想停还是更想再来。","anchors_by_band":null},
 {"id":"LRN-11","subscale":"掌握愉悦与挑战取向","report_subscale":"掌握愉悦与挑战取向","cluster":"mastery","construct":"掌握愉悦与挑战取向 Mastery & Challenge","text":"孩子更喜欢稳妥、有把握的事，对要费点劲的挑战大多回避。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"observe_hint":"面对要费劲的挑战，他更多是迎上去还是躲开。","anchors_by_band":null},
 {"id":"LRN-12","subscale":"面对挫折的恢复","report_subscale":"面对挫折的恢复","cluster":"resilience","construct":"面对挫折的恢复 Resilience to Challenge","text":"一件事没做好，孩子过一会儿能平复下来、愿意再试。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"他做不好一件事后多久能愿意再试。","note":"已正向化为 Resilience（正向计分）：本题为正向题，计分时不得再按 DMQ 负性反应翻转，仅同子维度的反向题 LRN-13 需翻转。","anchors_by_band":{"3-4":"需大人安抚后再试","4-5":"鼓励下能再试","5-6":"能较快自我平复再试"}},
 {"id":"LRN-13","subscale":"面对挫折的恢复","report_subscale":"面对挫折的恢复","cluster":"resilience","construct":"面对挫折的恢复 Resilience to Challenge","text":"试了一次没成功，孩子就认定「我不行」、不肯再碰。","age_bands":["4-5","5-6"],"scale":"freq5","options":f5(),"reverse":true,"observe_hint":"一次失败后他是否就放弃整件事。","anchors_by_band":null}
]},
{"id":"FAM","title":"家庭与养育环境","intro":"这一部分了解孩子成长的家庭环境——养育方式、家里的学习氛围、作息、语言和照看安排等。这些信息只用来更好地理解「孩子是在什么样的环境里被观察到的」，并为您生成更贴合的陪伴建议。这部分不评价孩子本身，也不计入孩子的优势画像，没有「标准答案」，请如实填写。","items":[
 {"id":"FAM-01","subscale":"养育方式·要求性","report_subscale":"养育方式·要求性","cluster":null,"construct":"结构/规则 Demandingness","text":"我会给孩子定清楚的日常规矩（比如几点睡、玩多久），并坚持执行。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"中性：高分代表家里结构清晰，并非「严厉」。","anchors_by_band":null},
 {"id":"FAM-02","subscale":"养育方式·要求性","report_subscale":"养育方式·要求性","cluster":null,"construct":"结构/规则 Demandingness","text":"孩子不守约定时，我会说明原因并要求他改正。","age_bands":["3-4","4-5","5-6"],"scale":"freq5","options":f5(),"reverse":false,"observe_hint":"体现「讲理＋要求」的养育方式。","anchors_by_band":null},

/* ============================================================================
   2. 内联 XLSX 写出器（store 方式 ZIP，自带 CRC32；不依赖任何外部库）
   生成真正可被 Excel / WPS 打开的 .xlsx：含 [Content_Types].xml、_rels、
   workbook、worksheet（inlineStr 写中文，免 sharedStrings 编码踩坑）。
   ============================================================================ */
const Zip = (function(){
  // --- CRC32（标准多项式 0xEDB88320，预生成查表） ---
  const CRC_TABLE = (function(){
    const t = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
      t[n]=c>>>0;
    }
    return t;
  })();
  function crc32(bytes){
    let c = 0xFFFFFFFF;
    for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  // UTF-8 编码为字节数组
  function utf8(str){ return new TextEncoder().encode(str); }
  // 小端写入辅助
  function u16(n){ return [n&0xFF, (n>>>8)&0xFF]; }
  function u32(n){ return [n&0xFF, (n>>>8)&0xFF, (n>>>16)&0xFF, (n>>>24)&0xFF]; }

  // 构建 store（不压缩）方式的 ZIP。files: [{name, data(Uint8Array)}]
  function build(files){
    const chunks = [];      // 本地文件区
    const central = [];     // 中央目录区
    let offset = 0;
    const enc = files.map(f=>({ name: utf8(f.name), data: f.data, crc: crc32(f.data) }));

    enc.forEach(f=>{
      const nameLen = f.name.length, dataLen = f.data.length;
      // ---- 本地文件头 (0x04034b50) ----
      const lh = [].concat(
        u32(0x04034b50), u16(20), u16(0), u16(0), // 签名/版本/flag/无压缩(0=store)
        u16(0), u16(0),                            // 修改时间/日期（置0）
        u32(f.crc), u32(dataLen), u32(dataLen),    // CRC / 压缩后 / 原始大小（store 相等）
        u16(nameLen), u16(0)                       // 文件名长 / 扩展字段长
      );
      const lhArr = new Uint8Array(lh.length + nameLen + dataLen);
      lhArr.set(lh,0); lhArr.set(f.name, lh.length); lhArr.set(f.data, lh.length+nameLen);
      chunks.push(lhArr);

      // ---- 中央目录记录 (0x02014b50) ----
      const ch = [].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0),
        u16(0), u16(0),
        u32(f.crc), u32(dataLen), u32(dataLen),
        u16(nameLen), u16(0), u16(0),  // 文件名长/扩展/注释长
        u16(0), u16(0), u32(0),        // 磁盘号/内部属性/外部属性
        u32(offset)                    // 本地头偏移
      );
      const chArr = new Uint8Array(ch.length + nameLen);
      chArr.set(ch,0); chArr.set(f.name, ch.length);
      central.push(chArr);

      offset += lhArr.length;
    });

    const centralSize = central.reduce((s,a)=>s+a.length,0);
    const centralOffset = offset;
    // ---- 中央目录结束记录 EOCD (0x06054b50) ----
    const eocd = new Uint8Array([].concat(
      u32(0x06054b50), u16(0), u16(0),
      u16(enc.length), u16(enc.length),
      u32(centralSize), u32(centralOffset), u16(0)
    ));

    // 拼接全部
    const total = chunks.reduce((s,a)=>s+a.length,0) + centralSize + eocd.length;
    const out = new Uint8Array(total);
    let p=0;
    chunks.forEach(a=>{ out.set(a,p); p+=a.length; });
    central.forEach(a=>{ out.set(a,p); p+=a.length; });
    out.set(eocd,p);
    return out;
  }
  return { build, utf8 };
})();

// XML 转义
function xmlEsc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}
// 列号 -> Excel 列字母（0->A）
function colLetter(i){
  let s=""; i=i+1;
  while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); }
  return s;
}
/* 用二维数组（行->单元格）生成 .xlsx 字节。每格按数字/字符串自动选类型。 */
function makeXlsx(rows){
  let sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetData>';
  rows.forEach((row, r)=>{
    sheet += '<row r="'+(r+1)+'">';
    row.forEach((cell, c)=>{
      const ref = colLetter(c)+(r+1);
      if(cell===null || cell===undefined || cell===""){
        // 空格也写出占位，保持列对齐（写空 inlineStr）
        sheet += '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve"></t></is></c>';
      } else if(typeof cell==="number" && isFinite(cell)){
        sheet += '<c r="'+ref+'"><v>'+cell+'</v></c>';
      } else {
        sheet += '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(cell)+'</t></is></c>';
      }
    });
    sheet += '</row>';
  });
  sheet += '</sheetData></worksheet>';

  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
    + '</Types>';

  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    + '</Relationships>';

  const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
    + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + '<sheets><sheet name="作答" sheetId="1" r:id="rId1"/></sheets></workbook>';

  const workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
    + '</Relationships>';

  const files = [
    { name:"[Content_Types].xml", data: Zip.utf8(contentTypes) },
    { name:"_rels/.rels",        data: Zip.utf8(rootRels) },
    { name:"xl/workbook.xml",    data: Zip.utf8(workbook) },
    { name:"xl/_rels/workbook.xml.rels", data: Zip.utf8(workbookRels) },
    { name:"xl/worksheets/sheet1.xml",   data: Zip.utf8(sheet) }
  ];
  return Zip.build(files);
}

/* ============================================================================
   3. 工具函数
   ============================================================================ */
const $ = sel => document.querySelector(sel);
const STORAGE_KEY = "qnn_draft_v1";

function pad2(n){ return (n<10?"0":"")+n; }
// ISO 8601 带 +08:00 时区（中国标准时间）
function isoNow(d){
  d = d || new Date();
  const off = -d.getTimezoneOffset(); // 分钟
  const sign = off>=0?"+":"-";
  const oh = pad2(Math.floor(Math.abs(off)/60)), om = pad2(Math.abs(off)%60);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"
    + pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds())
    + sign+oh+":"+om;
}
function dateStamp(d){ d=d||new Date(); return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }

// 由出生年月（YYYY-MM）与参照日期计算月龄
function monthsBetween(birthYM, ref){
  if(!birthYM) return null;
  const m = birthYM.split("-");
  if(m.length<2) return null;
  const by=+m[0], bm=+m[1];
  if(!by||!bm) return null;
  ref = ref || new Date();
  return (ref.getFullYear()-by)*12 + (ref.getMonth()+1 - bm);
}
function bandForMonths(mo){
  if(mo==null) return null;
  for(const b of ITEM_BANK.age_bands){ if(mo>=b.min_months && mo<=b.max_months) return b.id; }
  return "out_of_range";
}
// 生成单次会话随机标识：cid- + crypto.randomUUID()。仅标记本次作答，不跨次关联、不做纵向追踪。
// 若需复测对照，请人工以昵称对应两次结果。不依赖出生月/昵称/时间派生，避免可被反推或被误用作稳定标识。
function genChildId(){
  let rnd;
  if(typeof crypto!=="undefined" && crypto.randomUUID){
    rnd = crypto.randomUUID();
  } else if(typeof crypto!=="undefined" && crypto.getRandomValues){
    // 兜底：用 16 字节随机数拼成 UUID 形态（极少数旧环境无 randomUUID 时）
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
    const h=[...b].map(x=>x.toString(16).padStart(2,"0"));
    rnd = h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+"-"+h.slice(8,10).join("")+"-"+h.slice(10,16).join("");
  } else {
    rnd = "x".replace(/x/,()=> (Date.now().toString(16)+Math.random().toString(16).slice(2)));
  }
  return "cid-" + rnd;
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"),1800);
}
// 触发下载（Blob + 临时 a 标签；完全本地，无网络）
function download(filename, data, mime){
  const blob = (data instanceof Uint8Array) ? new Blob([data],{type:mime}) : new Blob([data],{type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function safeName(nick){
  return String(nick||"孩子").replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,24) || "孩子";
}

const App = (function(){
  // 页面序列：cover -> consent -> identity -> [section pages] -> done
  // 评分 section 顺序固定；OPEN 作为结尾开放题单独一页。
  const SCORED_SECTIONS = ["TMP","SEL","DEV","INT","LRN","FAM"];

  let state = {
    consent:false, consent_at:null,
    identity:{ birth_month:"", sex:"", nickname:"", relationship:"", daily_contact:"" },
    child_id:null,
    answers:{},            // item_id -> raw_value（数字 / 字符串 / 数组）
    open:{},               // OPEN item_id -> text
    pageIndex:0,           // 0=cover,1=consent,2=identity,3..=sections,last=done
    started_at:null,
    resumed_from_draft:false,
    section_seconds:{},    // sectionId -> 已累计秒
    total_active_sec:0
  };

  // 当前自适应页面列表（依据 age_band 决定每节是否有可见题；本工具所有节三段都看）
  let pages = [];          // [{type, id, title}]
  let ageBand = null;      // 当前年龄段
  let ageMonths = null;

  // ---- 计时（活跃时长；隐藏/久无操作暂停） ----
  let timer = { lastTick:Date.now(), curSection:null, idleMs:0, lastActivity:Date.now(), visible:true };
  const IDLE_LIMIT = 60*1000; // 超过 60 秒无操作视为挂起，不计入活跃时长

  function tickTiming(){
    const now = Date.now();
    const dt = now - timer.lastTick;
    timer.lastTick = now;
    if(!timer.visible) return;                       // 切后台不计
    if(now - timer.lastActivity > IDLE_LIMIT) return; // 长时间无操作不计
    const sec = dt/1000;
    state.total_active_sec += sec;
    const pg = pages[state.pageIndex];
    let sid = null;
    if(pg){ if(pg.type==="section") sid=pg.id; else if(pg.type==="open") sid="OPEN"; }
    if(sid){ state.section_seconds[sid] = (state.section_seconds[sid]||0) + sec; }
  }
  function markActivity(){ timer.lastActivity = Date.now(); }

  function startTimingLoop(){
    setInterval(tickTiming, 1000);
    document.addEventListener("visibilitychange", ()=>{
      tickTiming();
      timer.visible = !document.hidden;
      timer.lastTick = Date.now();
      if(timer.visible) timer.lastActivity = Date.now();
    });
    ["click","keydown","input","touchstart","scroll"].forEach(ev=>
      document.addEventListener(ev, markActivity, {passive:true}));
  }

  // ---- 草稿持久化 ----
  function saveDraft(){
    try{
      const snap = {
        consent:state.consent, consent_at:state.consent_at,
        identity:state.identity, child_id:state.child_id,
        answers:state.answers, open:state.open, pageIndex:state.pageIndex,
        started_at:state.started_at,
        section_seconds:state.section_seconds, total_active_sec:state.total_active_sec,
        saved_at: isoNow()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snap));
    }catch(e){ /* 隐私模式/容量满：静默降级，不阻断作答 */ }
  }
  function loadDraft(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function clearDraft(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }
  // 把内存 state 复位到初始值（清除草稿时调用，避免「清空存储但内存仍带旧作答/续填标记」）
  function resetState(){
    state = {
      consent:false, consent_at:null,
      identity:{ birth_month:"", sex:"", nickname:"", relationship:"", daily_contact:"" },
      child_id:null,
      answers:{}, open:{},

  // ---- 计算自适应页面列表 ----
  function rebuildPages(){
    ageMonths = monthsBetween(state.identity.birth_month);
    ageBand = bandForMonths(ageMonths);
    // 越界时锚点用 5-6（最贴近学龄）作为参照展示，但 age_band 记 out_of_range
    pages = [
      {type:"cover"}, {type:"consent"}, {type:"identity"}
    ];
    SCORED_SECTIONS.forEach(sid=>{
      pages.push({type:"section", id:sid, title:sectionById(sid).title});
    });
    pages.push({type:"open", id:"OPEN", title:"您还想说的"});
    pages.push({type:"done"});
  }
  function sectionById(id){ return ITEM_BANK.sections.find(s=>s.id===id); }

  // 锚点展示用的 band（越界回退到最近端）
  function anchorBand(){
    if(ageBand==="3-4"||ageBand==="4-5"||ageBand==="5-6") return ageBand;
    if(ageMonths!=null && ageMonths<36) return "3-4";
    return "5-6";
  }
  // 某题是否在当前 band 呈现
  function itemVisible(item){
    const b = (ageBand && ageBand!=="out_of_range") ? ageBand : anchorBand();
    return item.age_bands.indexOf(b) >= 0;
  }
  // 当前 band 下，某节实际呈现的题
  function visibleItems(sid){
    return sectionById(sid).items.filter(itemVisible);
  }

  // ============== 渲染 ==============
  function render(){
    const pg = pages[state.pageIndex];

    $("#btnNext").classList.remove("hidden");

    $("#btnNext").className = "btn btn-primary";

    if(pg.type==="cover") renderCover(app);
    else if(pg.type==="consent") renderConsent(app);
    else if(pg.type==="identity") renderIdentity(app);
    else if(pg.type==="section") renderSection(app, pg.id);
    else if(pg.type==="open") renderOpen(app);
    else if(pg.type==="done") renderDone(app);

    window.scrollTo(0,0);
  }

  function updateProgress(){
    const pg = pages[state.pageIndex];
    let pct=0, label="封面";

    if(pg.type==="cover"){ pct=0; label="封面"; }

    else if(pg.type==="open"){ pct=96; label="开放题"; }

  // 渲染排序（F）：把同一 consistency_pair_id 的成对正反题在同屏内打散，
  // 使两题间隔 ≥3 题（或被挤到末尾），降低家长「照前一题对着填」的连贯作答偏差。
  // 仅影响呈现顺序；导出/计分仍按题库原顺序，不受影响。
  function displayOrder(items){
    const MIN_GAP = 3;            // 成对题之间至少间隔的题数
    const queue = items.slice();  // 待放置
    const out = [];
    const placedAt = {};          // consistency_pair_id -> 已放置成员的 out 下标
    let guard = 0;
    while(queue.length && guard++ < items.length*items.length + 5){
      let pickedIdx = -1;
      for(let i=0;i<queue.length;i++){
        const pid = queue[i].consistency_pair_id;
        // 若该题的配对题尚未放置，或距上次放置已达 MIN_GAP，则可放
        if(!pid || placedAt[pid]===undefined || (out.length - placedAt[pid]) >= MIN_GAP){
          pickedIdx = i; break;
        }
      }
      // 若全被「间隔不足」挡住（队首都是同对的另一半且太近），退而取队首避免死循环
      if(pickedIdx === -1) pickedIdx = 0;
      const it = queue.splice(pickedIdx,1)[0];
      if(it.consistency_pair_id) placedAt[it.consistency_pair_id] = out.length;
      out.push(it);
    }
    return out;
  }

  // 渲染单题（freq5/like5 单选、single 单选、multi 多选）
  function renderItem(item, ab){
    const anchor = (item.anchors_by_band && item.anchors_by_band[ab]) ? item.anchors_by_band[ab] : null;
    let html = `<div class="item" id="item_${item.id}" data-id="${item.id}">`;
    html += `<div class="stem"><span class="qno">${item.id}</span>${xmlEsc(item.text)}</div>`;
    if(anchor) html += `<span class="anchor">本龄段观察例子：${xmlEsc(anchor)}</span>`;
    if(item.observe_hint) html += `<div class="obs">提示：${xmlEsc(item.observe_hint)}</div>`;
    const cur = state.answers[item.id];

    if(item.scale==="multi"){
      html += `<div class="opts">`;
      item.options.forEach(o=>{
        const checked = Array.isArray(cur) && cur.indexOf(o.v)>=0;
        html += `<label class="opt ${checked?'checked':''}" data-item="${item.id}" data-v="${xmlEsc(o.v)}">
          <input type="checkbox" ${checked?"checked":""}>
          <span>${xmlEsc(o.label)}</span></label>`;
      });
      html += `</div>`;
    } else {
      // 单选：freq5 / like5 / single
      html += `<div class="opts">`;
      item.options.forEach(o=>{
        const checked = (cur===o.v);
        const showV = (item.scale==="freq5"||item.scale==="like5") ? `<span class="ov">${o.v}</span>` : "";
        html += `<label class="opt ${checked?'checked':''}" data-item="${item.id}" data-v="${xmlEsc(o.v)}">
          <input type="radio" name="r_${item.id}" ${checked?"checked":""}>
          <span>${xmlEsc(o.label)}</span>${showV}</label>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }

  function bindItemInputs(items){
    items.forEach(item=>{
      const wrap = document.getElementById("item_"+item.id);
      if(!wrap) return;
      wrap.querySelectorAll(".opt").forEach(lab=>{
        lab.addEventListener("click", (e)=>{
          // 让原生 input 处理后再同步状态
          const v = lab.getAttribute("data-v");
          const realV = coerceV(item, v);
          if(item.scale==="multi"){
            let arr = Array.isArray(state.answers[item.id]) ? state.answers[item.id].slice() : [];
            const i = arr.indexOf(realV);
            // 由 input 的最终 checked 状态决定（点击 label 会 toggle input）
            setTimeout(()=>{
              const input = lab.querySelector("input");
              arr = Array.isArray(state.answers[item.id]) ? state.answers[item.id].slice() : [];
              const j = arr.indexOf(realV);
              if(input.checked){ if(j<0) arr.push(realV); }
              else { if(j>=0) arr.splice(j,1); }
              state.answers[item.id] = arr;
              refreshChecks(wrap, item);
              saveDraft();
            },0);
          } else {
            state.answers[item.id] = realV;
            refreshChecks(wrap, item);
            saveDraft();
          }
          wrap.classList.remove("flag");
        });
      });
    });
  }
  // freq5/like5 的 v 是数字，single/multi 是字符串
  function coerceV(item, v){
    if(item.scale==="freq5"||item.scale==="like5") return parseInt(v,10);
    return v;
  }
  function refreshChecks(wrap, item){
    const cur = state.answers[item.id];
    wrap.querySelectorAll(".opt").forEach(lab=>{
      const realV = coerceV(item, lab.getAttribute("data-v"));
      let on = false;
      if(item.scale==="multi") on = Array.isArray(cur) && cur.indexOf(realV)>=0;
      else on = (cur===realV);
      lab.classList.toggle("checked", on);
      const input = lab.querySelector("input");
      if(input) input.checked = on;
    });
  }

  // ============== 导航 + 校验 ==============
  function next(){
    const pg = pages[state.pageIndex];
    if(pg.type==="cover"){ go(1); return; }
    if(pg.type==="consent"){
      if(!state.consent){ toast("请先勾选同意后再继续"); return; }
      go(state.pageIndex+1); return;
    }
    if(pg.type==="identity"){
      const miss = validateIdentity();
      if(miss){ toast(miss); return; }
      if(!state.child_id) state.child_id = genChildId();
      if(!state.started_at) state.started_at = isoNow();
      rebuildPages();
      saveDraft();
      go(state.pageIndex+1); return;
    }
    if(pg.type==="section"){
      const un = unanswered(pg.id);
      if(un.length){
        flagUnanswered(un);
        toast("还有 "+un.length+" 题未作答，请补充（已标红）");
        return;
      }
      go(state.pageIndex+1); return;
    }
    if(pg.type==="open"){
      // 开放题可留空
      state.submitted_at = isoNow();
      saveDraft();
      go(state.pageIndex+1); return;
    }
  }
  function prev(){ if(state.pageIndex>0) go(state.pageIndex-1); }
  function go(i){
    tickTiming();
    state.pageIndex = Math.max(0, Math.min(pages.length-1, i));
    saveDraft();
    render();
  }

  function validateIdentity(){
    for(const f of ITEM_BANK.identity_fields){
      if(f.required && !String(state.identity[f.id]||"").trim()){
        return "请填写：" + f.label;
      }
    }
    const mo = monthsBetween(state.identity.birth_month);
    if(mo==null) return "请选择有效的出生年月";
    return null;
  }

  function unanswered(sid){
    const items = visibleItems(sid);
    const miss=[];
    items.forEach(item=>{
      const v = state.answers[item.id];
      if(item.scale==="multi"){
        // 多选必答至少一项；FAM-07 提供「暂时都没有」选项以便如实表达「一样都没有」，FAM-12「主要由谁照看」必有至少一项
        if(!Array.isArray(v) || v.length===0) miss.push(item.id);
      } else {
        if(v===undefined || v===null || v==="") miss.push(item.id);
      }
    });
    return miss;
  }
  function flagUnanswered(ids){
    ids.forEach(id=>{
      const el = document.getElementById("item_"+id);
      if(el) el.classList.add("unanswered","flag");

    const first = document.getElementById("item_"+ids[0]);
    if(first) first.scrollIntoView({behavior:"smooth", block:"center"});

  // ============== 导出数据构建 ==============
  // 把内部状态整理为符合 docs/json-schema.md 的导出对象
  function buildExport(){
    const ab = (ageBand && ageBand!=="out_of_range") ? ageBand : "out_of_range";
    const displayBand = anchorBand(); // 锚点呈现所用 band
    const submitted = state.submitted_at || isoNow();
    const ageAtSubmit = monthsBetween(state.identity.birth_month, new Date(submitted));

    const responses = [];
    SCORED_SECTIONS.forEach(sid=>{
      visibleItems(sid).forEach(item=>{
        const raw = state.answers[item.id];
        let valueLabel;
        if(item.scale==="multi"){
          const arr = Array.isArray(raw)?raw:[];
          valueLabel = arr.map(v=>{ const o=item.options.find(x=>x.v===v); return o?o.label:String(v); });
        } else {
          const o = item.options.find(x=>x.v===raw);
          valueLabel = o ? o.label : "";
        }
        const anchorShown = (item.anchors_by_band && item.anchors_by_band[displayBand]) ? item.anchors_by_band[displayBand] : null;
        // 断言（D）：anchor_shown 必须 ∈ 该呈现段 anchors_by_band ∪ {null}，杜绝杜撰锚点
        if(anchorShown!==null){
          const band = item.anchors_by_band ? item.anchors_by_band[displayBand] : undefined;
          if(band===undefined || band===null || anchorShown!==band){
            throw new Error("导出中止："+item.id+" 的锚点 anchor_shown 与题库本段（"+displayBand+"）锚点不一致，疑似杜撰。请勿手改导出，刷新后重试。");
          }
        }
        responses.push({
          item_id:item.id, section:sid, construct:item.construct, subscale:item.subscale,
          report_subscale:(item.report_subscale!==undefined?item.report_subscale:null),
          cluster:(item.cluster!==undefined?item.cluster:null),
          consistency_pair_id:(item.consistency_pair_id!==undefined?item.consistency_pair_id:null),
          question_text:item.text, scale:item.scale,
          raw_value:(raw===undefined?null:raw),
          value_label:valueLabel,
          age_band:displayBand,   // 锚点实际呈现所用段（越界时回退到 3-4 或 5-6），用于锚点复现；顶层 age_band 仍记 out_of_range
          reverse:!!item.reverse,
          scored:(sid!=="FAM"),
          anchor_shown:anchorShown
        });
      });
    });

    const openEnded = [];
    sectionById("OPEN").items.forEach(item=>{
      openEnded.push({ item_id:item.id, construct:item.construct, question_text:item.text, text:(state.open[item.id]||"") });
    });

    // 计时整理（四舍五入到整秒）
    const per = {};
    ["TMP","SEL","DEV","INT","LRN","FAM","OPEN"].forEach(s=>{ per[s]=Math.round(state.section_seconds[s]||0); });

    // 数据质量：本端可计算最长连续同选串（仅 freq5/like5 评分题），其余留 false 由 skill 判定
    const lq = longstringMax(responses);
    // familiarity_low（E）：由 _identity_extra.daily_contact 计算——相处时长很低则判低熟悉度
    // 口径：每日相处不足1小时（lt1）即低熟悉度；其他档位为 false。relationship 仅作上下文，不单独触发。
    const familiarityLow = (state.identity.daily_contact==="lt1");

    return {
      schema_version:"1.1",
      instrument:{
        name:ITEM_BANK.instrument.name, version:ITEM_BANK.instrument.version,
        date:ITEM_BANK.instrument.date, age_range:ITEM_BANK.instrument.age_range,
        language:ITEM_BANK.instrument.language, item_bank_version:ITEM_BANK.instrument.item_bank_version
      },
      child:{
        child_id:state.child_id, nickname:(state.identity.nickname||null),
        birth_month:state.identity.birth_month,
        age_months_at_submit:(ageAtSubmit==null?null:ageAtSubmit),
        sex:state.identity.sex
      },
      age_band: ab,
      consent:{ agreed:true, consent_version:ITEM_BANK.consent_version, agreed_at:(state.consent_at||isoNow()) },
      responses, open_ended:openEnded,
      meta:{
        timing:{
          started_at:state.started_at, submitted_at:submitted,
          total_active_sec:Math.round(state.total_active_sec),
          per_section_sec:per, resumed_from_draft:!!state.resumed_from_draft
        },
        quality:{
          straightlining_flag:(lq>=10), fast_response_flag:false, high_missing_flag:false,
          inconsistency_flag:false, sdb_halo_flag:false, familiarity_low:familiarityLow,
          recent_disruption:false, longstring_max:lq, notes:null,
          // 各旗标的计算来源/状态（E）：reserved=本版恒 false 暂不计算；computed*=本端已计算或留给 skill 计算
          quality_flag_status:{
            sdb_halo:"reserved",                              // 预留·本版恒 false·暂不计算（不加陷阱/探针题）
            inconsistency:"computed_in_skill_from_pairs",     // 由正反配对题（consistency_pair_id）在 skill 侧计算
            longstring:"computed",                            // 由答案直线度本端计算（longstring_max / straightlining_flag）
            familiarity_low:"computed_from_contact"           // 由 _identity_extra.daily_contact 计算
          }
        }
      },
      // 附：本次身份采集中关系/相处时长（schema 未强制，但保留以备 skill 判定 familiarity_low）
      _identity_extra:{ relationship:state.identity.relationship, daily_contact:state.identity.daily_contact }
    };
  }

  // 最长连续同选串（仅按 freq5/like5 评分题的 raw_value 连续相等计数）
  function longstringMax(responses){
    let max=0, cur=0, prev=null;
    responses.forEach(r=>{
      if((r.scale==="freq5"||r.scale==="like5") && typeof r.raw_value==="number"){
        if(r.raw_value===prev){ cur++; } else { cur=1; prev=r.raw_value; }
        if(cur>max) max=cur;
      } else { prev=null; cur=0; }
    });
    return max;
  }

  // ---- 导出：JSON ----
  function exportJSON(){
    let data;
    try{ data = buildExport(); }
    catch(e){ toast(e && e.message ? e.message : "导出失败"); return; }
    const json = JSON.stringify(data, null, 2);
    const fn = "测评作答_" + safeName(state.identity.nickname) + "_" + dateStamp() + ".json";
    download(fn, json, "application/json;charset=utf-8");
    toast("已导出 JSON");
    promptClearAfterExport();
  }

  // ---- 导出：Markdown（人机可读镜像）----
  function exportMD(){
    let d;
    try{ d = buildExport(); }
    catch(e){ toast(e && e.message ? e.message : "导出失败"); return; }
    const L = [];
    L.push("# 幼儿发展优势与兴趣画像 · 作答镜像");
    L.push("");
    L.push("> 本文件为问卷作答的人读镜像，与导出 JSON 内容一致。非诊断、非筛查、非排名。");
    L.push("");
    L.push("## 基本信息");
    L.push("");
    L.push("| 项目 | 内容 |");
    L.push("|---|---|");
    L.push("| 孩子昵称 | "+(d.child.nickname||"（未填，统称「孩子」）")+" |");
    L.push("| 出生年月 | "+(d.child.birth_month||"")+" |");
    L.push("| 提交时月龄 | "+(d.child.age_months_at_submit==null?"":d.child.age_months_at_submit+" 个月")+" |");
    L.push("| 年龄段 | "+d.age_band+" |");
    L.push("| 性别 | "+sexLabel(d.child.sex)+" |");
    L.push("| child_id | "+d.child.child_id+" |");
    L.push("| 填写人关系 | "+relLabel(d._identity_extra.relationship)+" |");
    L.push("| 每日相处 | "+contactLabel(d._identity_extra.daily_contact)+" |");
    L.push("| 开始时间 | "+d.meta.timing.started_at+" |");
    L.push("| 提交时间 | "+d.meta.timing.submitted_at+" |");
    L.push("| 总活跃时长 | "+d.meta.timing.total_active_sec+" 秒 |");
    L.push("| 是否续填草稿 | "+(d.meta.timing.resumed_from_draft?"是":"否")+" |");
    L.push("");

    SCORED_SECTIONS.forEach(sid=>{
      const sec = sectionById(sid);
      const rs = d.responses.filter(r=>r.section===sid);
      if(!rs.length) return;
      L.push("## "+sec.title+(sid==="FAM"?"（家庭环境，不计入孩子画像）":""));
      L.push("");
      rs.forEach(r=>{
        const lbl = Array.isArray(r.value_label)?r.value_label.join("、"):r.value_label;
        L.push("- **"+r.item_id+"** "+r.question_text);
        L.push("  - 所选：**"+(lbl||"（未答）")+"**"+(typeof r.raw_value==="number"?"（"+r.raw_value+"分）":"")+(r.reverse?" ｜反向题":""));
        if(r.anchor_shown) L.push("  - 本龄段锚点："+r.anchor_shown);
      });
      L.push("");
    });

    L.push("## 开放题");
    L.push("");
    d.open_ended.forEach(o=>{
      L.push("- **"+o.item_id+"** "+o.question_text);
      L.push("  - "+(o.text?o.text:"（未填写）"));
    });
    L.push("");
    L.push("## 分块用时（秒）");
    L.push("");
    L.push("| 分块 | TMP | SEL | DEV | INT | LRN | FAM | OPEN |");
    L.push("|---|---|---|---|---|---|---|---|");
    const p=d.meta.timing.per_section_sec;
    L.push("| 用时 | "+p.TMP+" | "+p.SEL+" | "+p.DEV+" | "+p.INT+" | "+p.LRN+" | "+p.FAM+" | "+p.OPEN+" |");
    L.push("");
    L.push("> 免责声明：本测评做个体内相对比较，不下临床标签、不报人群百分位。若有持续担忧，请咨询专业人士。");

    const fn = "测评作答_" + safeName(state.identity.nickname) + "_" + dateStamp() + ".md";
    download(fn, L.join("\n"), "text/markdown;charset=utf-8");
    toast("已导出 Markdown");
    promptClearAfterExport();
  }

  // ---- 导出：CSV（一题一行，带 UTF-8 BOM）----
  function csvCell(s){
    s = (s==null)?"":String(s);
    if(/[",\n\r]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function buildRows(d){
    // 表头 + 每题一行：题号/分块/子维度/报告维度/同义簇/配对ID/题干/所选项/原始值/年龄段/是否反向/是否计分
    const rows = [["题号","分块","子维度","报告维度","同义簇","配对ID","题干","所选项","原始值","年龄段","是否反向","是否计分"]];
    d.responses.forEach(r=>{
      const lbl = Array.isArray(r.value_label)?r.value_label.join("、"):r.value_label;
      const raw = Array.isArray(r.raw_value)?r.raw_value.join("、"):(r.raw_value==null?"":r.raw_value);
      rows.push([r.item_id, r.section, r.subscale, (r.report_subscale==null?"":r.report_subscale), (r.cluster==null?"":r.cluster), (r.consistency_pair_id==null?"":r.consistency_pair_id), r.question_text, lbl, raw, r.age_band, r.reverse?"是":"否", r.scored?"是":"否"]);
    });
    d.open_ended.forEach(o=>{
      rows.push([o.item_id,"OPEN","开放题","","","",o.question_text,o.text||"","","-","否","否"]);
    });
    return rows;
  }
  function exportCSV(){
    let d;
    try{ d = buildExport(); }
    catch(e){ toast(e && e.message ? e.message : "导出失败"); return; }
    const rows = buildRows(d);
    const csv = rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
    const bom = "﻿"; // UTF-8 BOM，确保 Excel 中文不乱码
    const fn = "测评作答_" + safeName(state.identity.nickname) + "_" + dateStamp() + ".csv";
    download(fn, bom+csv, "text/csv;charset=utf-8");
    toast("已导出 CSV");
    promptClearAfterExport();
  }

  // ---- 导出：XLSX（内联写出器）----
  function exportXLSX(){
    let d;
    try{ d = buildExport(); }
    catch(e){ toast(e && e.message ? e.message : "导出失败"); return; }
    const rows = buildRows(d);
    // 在表前加几行元信息
    const meta = [
      ["幼儿发展优势与兴趣画像 · 作答表"],
      ["昵称", d.child.nickname||"孩子", "年龄段", d.age_band, "月龄", d.child.age_months_at_submit==null?"":d.child.age_months_at_submit],
      ["child_id", d.child.child_id, "提交时间", d.meta.timing.submitted_at, "活跃秒", d.meta.timing.total_active_sec],
      []
    ];
    const all = meta.concat(rows);
    try{
      const bytes = makeXlsx(all);
      const fn = "测评作答_" + safeName(state.identity.nickname) + "_" + dateStamp() + ".xlsx";
      download(fn, bytes, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      toast("已导出 Excel(.xlsx)");
      promptClearAfterExport();
    }catch(e){
      toast("XLSX 生成失败，请改用 CSV");
    }
  }

  // ---- 导出：打印 / 存为 PDF（回顾单）----
  function printReview(){
    let d;
    try{ d = buildExport(); }
    catch(e){ toast(e && e.message ? e.message : "导出失败"); return; }
    const area = $("#print-area");
    let h = "";
    h += '<div class="print-h1">'+xmlEsc(ITEM_BANK.instrument.name)+' · 作答回顾单</div>';
    const nick = d.child.nickname||"孩子";
    h += '<div class="print-meta">孩子：'+xmlEsc(nick)+' ｜ 年龄段：'+d.age_band
      +' ｜ 月龄：'+(d.child.age_months_at_submit==null?"-":d.child.age_months_at_submit)
      +' ｜ 提交：'+xmlEsc(d.meta.timing.submitted_at)+'</div>';
    h += '<div class="print-meta">提示：本回顾单为个体内相对画像，非诊断、非筛查、非排名。如有持续担忧请咨询专业人士。</div>';
    SCORED_SECTIONS.forEach(sid=>{
      const rs = d.responses.filter(r=>r.section===sid);
      if(!rs.length) return;
      h += '<div class="print-sec">'+xmlEsc(sectionById(sid).title)+'</div>';
      rs.forEach(r=>{
        const lbl = Array.isArray(r.value_label)?r.value_label.join("、"):r.value_label;
        h += '<div class="print-q"><span class="pno">'+r.item_id+'</span>'+xmlEsc(r.question_text)
           + ' <span class="pa">▶ '+xmlEsc(lbl||"（未答）")+'</span></div>';
      });
    });
    h += '<div class="print-sec">开放题</div>';
    d.open_ended.forEach(o=>{
      h += '<div class="print-q"><span class="pno">'+o.item_id+'</span>'+xmlEsc(o.question_text)
         + '<br><span class="pa">'+xmlEsc(o.text||"（未填写）")+'</span></div>';
    });
    area.innerHTML = h;
    window.print();
  }

  function doClearDraft(){
    clearDraft();
    resetState();   // 同步复位内存 state，避免重开时残留旧作答/续填标记
    toast("草稿已清除");
    render();
  }

  // ---- 续填草稿 ----
  function resumeDraft(draft){
    state.consent = !!draft.consent;
    state.consent_at = draft.consent_at||null;
    state.identity = Object.assign(state.identity, draft.identity||{});
    state.child_id = draft.child_id || null;
    state.answers = draft.answers || {};
    state.open = draft.open || {};
    state.started_at = draft.started_at || isoNow();
    state.section_seconds = draft.section_seconds || {};
    state.total_active_sec = draft.total_active_sec || 0;
    state.resumed_from_draft = true;       // 标记续填
    if(!state.child_id)
      state.child_id = genChildId();
    rebuildPages();
    // 跳到上次所在页（但至少从身份页之后，避免越界）
    const idx = Math.min(draft.pageIndex||0, pages.length-1);
    state.pageIndex = idx;
    saveDraft();
    render();
    toast("已恢复上次进度");
  }

  // ---- 初始化 ----
  function init(){
    rebuildPages();
    render();
    startTimingLoop();
    // 离开页面前保存
    window.addEventListener("beforeunload", saveDraft);
  }

  // 标签辅助（导出人读时用）
  function sexLabel(v){ return ({girl:"女孩",boy:"男孩",prefer_not:"不便填写"})[v]||v||""; }
  function relLabel(v){ return ({mother:"妈妈",father:"爸爸",grandparent:"祖辈",other_caregiver:"其他主要照看人"})[v]||v||""; }
  function contactLabel(v){ return ({lt1:"不足1小时","1to3":"1-3小时","3to6":"3-6小时",gt6:"6小时以上"})[v]||v||""; }

  return {
    init, next, prev,
    exportJSON, exportMD, exportCSV, exportXLSX, printReview,
    doClearDraft, dismissClearPrompt,
    _buildExport: buildExport  // 便于调试
  };
})();

document.addEventListener("DOMContentLoaded", App.init);
</script>
</body>
